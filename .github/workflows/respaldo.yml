name: Respaldo de la base de datos

# Cada 30 minutos revisa la programación guardada en el sistema (RF-06: activo, frecuencia, hora y retención en
# app.parametros) y los respaldos manuales pedidos. La cadena de conexión va solo en el Secret SUPABASE_DB_URL.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - name: ¿Corresponde respaldar?
        id: decidir
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::warning::Falta el Secret SUPABASE_DB_URL: no se respalda"; echo "hacer=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          q() { docker run --rm postgres:17 psql "$SUPABASE_DB_URL" -At -c "$1"; }
          activo=$(q "select valor #>> '{}' from app.parametros where clave = 'respaldo_activo'")
          frecuencia=$(q "select valor #>> '{}' from app.parametros where clave = 'respaldo_frecuencia'")
          hora=$(q "select valor #>> '{}' from app.parametros where clave = 'respaldo_hora_utc'")
          retencion=$(q "select valor #>> '{}' from app.parametros where clave = 'respaldo_retencion_dias'")
          echo "retencion=${retencion:-30}" >> "$GITHUB_OUTPUT"
          echo "Programación: activo=$activo frecuencia=$frecuencia hora_utc=$hora retención=${retencion}d"
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "hacer=si" >> "$GITHUB_OUTPUT"; exit 0; fi
          ahora_h=$(date -u +%H); ahora_m=$(date -u +%M); dia_sem=$(date -u +%u); dia_mes=$(date -u +%d)
          toca_frecuencia=no
          case "$frecuencia" in
            semanal) [ "$dia_sem" = "1" ] && toca_frecuencia=si ;;
            mensual) [ "$dia_mes" = "01" ] && toca_frecuencia=si ;;
            *) toca_frecuencia=si ;;
          esac
          if [ "$activo" = "true" ] && [ "$toca_frecuencia" = "si" ] && [ "$ahora_h" = "${hora%%:*}" ] && [ "$ahora_m" -lt 30 ]; then
            echo "Respaldo programado"; echo "hacer=si" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pedidos=$(docker run --rm postgres:17 psql "$SUPABASE_DB_URL" -At -c "select count(*) from public.bitacora_eventos p where p.accion = 'respaldo_pedido' and p.fecha_servidor > coalesce((select max(fecha_servidor) from public.bitacora_eventos where accion = 'respaldo'), '-infinity')")
          echo "Respaldos manuales pendientes: $pedidos"
          [ "$pedidos" != "0" ] && echo "hacer=si" >> "$GITHUB_OUTPUT" || echo "hacer=no" >> "$GITHUB_OUTPUT"
      - name: pg_dump cifrado
        if: steps.decidir.outputs.hacer == 'si'
        id: volcado
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RESPALDO_CLAVE: ${{ secrets.RESPALDO_CLAVE }}
          REPO_PRIVADO: ${{ github.event.repository.private }}
        run: |
          # Los artefactos de un repositorio público los descarga cualquier cuenta de GitHub: el respaldo se cifra
          # siempre con la frase del Secret RESPALDO_CLAVE (AES-256) y sin ella no se publica.
          if [ -z "$RESPALDO_CLAVE" ]; then
            if [ "$REPO_PRIVADO" != "true" ]; then
              echo "::error::Falta el Secret RESPALDO_CLAVE: en un repositorio público el respaldo no se publica sin cifrar."
              exit 1
            fi
            echo "::warning::Falta el Secret RESPALDO_CLAVE: el respaldo se guarda sin cifrar (repositorio privado)."
          fi
          base="respaldo-$(date -u +%Y%m%d-%H%M).dump"
          docker run --rm -v "$PWD:/r" postgres:17 pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=app --file="/r/$base"
          archivo="$base"
          if [ -n "$RESPALDO_CLAVE" ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "$RESPALDO_CLAVE" --symmetric --cipher-algo AES256 \
              --output "$base.gpg" "$base"
            rm -f "$base"
            archivo="$base.gpg"
          fi
          sha=$(sha256sum "$archivo" | cut -d' ' -f1)
          bytes=$(stat -c%s "$archivo")
          echo "archivo=$archivo" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "$sha  $archivo" > "$archivo.sha256"
      - uses: actions/upload-artifact@v4
        if: steps.decidir.outputs.hacer == 'si'
        with:
          name: ${{ steps.volcado.outputs.archivo }}
          path: |
            ${{ steps.volcado.outputs.archivo }}
            ${{ steps.volcado.outputs.archivo }}.sha256
          retention-days: ${{ steps.decidir.outputs.retencion }}
      - name: Registrar el respaldo en la bitácora
        if: steps.decidir.outputs.hacer == 'si'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm postgres:17 psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "insert into public.bitacora_eventos (accion, tabla, datos_despues) values ('respaldo', 'respaldos', jsonb_build_object('archivo', '${{ steps.volcado.outputs.archivo }}', 'bytes', ${{ steps.volcado.outputs.bytes }}, 'sha256', '${{ steps.volcado.outputs.sha }}', 'ejecucion', '${{ github.run_id }}'))"
