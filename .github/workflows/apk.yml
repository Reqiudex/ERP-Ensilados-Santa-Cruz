name: APK Android (Release)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - name: Clave de firma estable (Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin clave de firma en los Secrets: el APK se firma con una clave de depuración distinta en cada compilación y no se podrá instalar encima de la versión anterior."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/publicacion.jks
          {
            echo "storeFile=publicacion.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk erp-ensilados-santa-cruz.apk
      - name: Quitar la Release anterior para que la etiqueta apunte a este commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete apk-ultima --cleanup-tag -y -R ${{ github.repository }} || true
      - name: Publicar en la Release «apk-ultima»
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-ultima
          target_commitish: ${{ github.sha }}
          name: APK Android (última versión)
          body: |
            APK de la app de los centros de acopio (Android 8 o superior). Instale el archivo directamente en el teléfono
            (permita «instalar apps de origen desconocido»). Versión generada desde ${{ github.sha }}.
          prerelease: false
          make_latest: true
          files: erp-ensilados-santa-cruz.apk
