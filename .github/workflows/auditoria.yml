name: Auditoría de controles

# Se ejecuta a mano: las pruebas crean registros en la base en línea y la demo debe quedar limpia.
on:
  workflow_dispatch:

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Ejecutar las 11 pruebas (API y SQL directo)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/auditoria.sh
      - name: Resumen
        if: always()
        run: cat build/informes/resultados_auditoria.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados_auditoria
          path: build/informes/resultados_auditoria.md
