name: Pruebas CP-01 a CP-27

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - name: Ejecutar los 27 casos (unitarios y de caja negra contra Supabase en línea)
        run: scripts/pruebas.sh
      - name: Resumen
        if: always()
        run: cat build/informes/resultados_pruebas.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados_pruebas
          path: build/informes/resultados_pruebas.md
